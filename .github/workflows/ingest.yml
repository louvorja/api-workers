name: Ingestão do catálogo

# O ingest espelha o banco JSON da origem legada no R2 e republica
# meta/bundle.zip. Não roda no Cron Trigger do Worker: são 18.060 escritas no
# R2 por execução (o limite é 1.000 subrequests), 28MB de bundle contra 128MB
# de memória, e os binários zip/unzip. Aqui tem tempo, banda e disco.
on:
  schedule:
    - cron: "0 7 * * *" # 04:00 em São Paulo
  workflow_dispatch:

# Duas ingestões simultâneas escreveriam as mesmas chaves no bucket.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sem o estado, toda execução regrava as 18.060 tabelas em vez de só o
      # que mudou de hash na origem. Perder o cache não quebra nada — só torna
      # a execução seguinte completa.
      - name: Restaura estado da ingestão
        uses: actions/cache@v4
        with:
          path: .ingest-state.json
          key: ingest-state-${{ github.run_id }}
          restore-keys: ingest-state-

      - name: Ingestão
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LEGACY_API_URL: ${{ vars.LEGACY_API_URL || 'https://api.louvorja.com.br' }}
          LEGACY_API_TOKEN: ${{ secrets.LEGACY_API_TOKEN }}
        run: node --experimental-strip-types scripts/ingest.ts
