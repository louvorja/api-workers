name: Manutenção da API

on:
  schedule:
    # O PHP reconciliava tamanho/duração e exportava os bancos a cada hora.
    - cron: "17 * * * *"
    # O PHP atualizava o catálogo do YouTube mensalmente.
    - cron: "37 3 1 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarefa a executar"
        required: true
        type: choice
        default: publish
        options:
          - publish
          - refresh_files_size
          - refresh_files_duration
          - refresh_online_videos
          - import_slides

# Todas as tarefas podem publicar os mesmos objetos e chaves de versão.
concurrency:
  group: maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    # O agendamento grava em produção sem ninguém olhando. Ele só roda depois que
    # a primeira publicação manual foi conferida e a variável MAINTENANCE_SCHEDULE
    # do repositório foi posta em "on". O disparo manual funciona sempre.
    if: github.event_name != 'schedule' || vars.MAINTENANCE_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ebfd182d9bc3913163758a88118752f5
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ORIGINALS_BUCKET: files-original
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # Leitura dos lançamentos do Delphi, sem o limite de pedidos anônimos.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ffprobe (duração dos áudios) vem no pacote do ffmpeg.
      - name: Ferramentas nativas
        run: sudo apt-get update && sudo apt-get install -y ffmpeg zip unzip

      - name: Escolher tarefa
        id: task
        env:
          REQUESTED_TASK: ${{ inputs.task }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$REQUESTED_TASK" ]; then
            task="$REQUESTED_TASK"
          elif [ "$EVENT_SCHEDULE" = "37 3 1 * *" ]; then
            task="refresh_online_videos"
          else
            task="refresh_files_all"
          fi
          # A rotina de hora em hora só segue adiante quando o painel alterou
          # algo. Uma vez por dia ela roda inteira mesmo assim, para pegar
          # arquivo trocado direto no R2.
          gate=false
          if [ "$task" = "refresh_files_all" ] && [ "$(date -u +%H)" != "06" ]; then
            gate=true
          fi
          printf 'task=%s\ngate=%s\n' "$task" "$gate" >> "$GITHUB_OUTPUT"
          printf 'Executando %s (checagem prévia: %s)\n' "$task" "$gate"

      # Cada export conta, na cota diária de leitura do D1, uma linha por linha
      # exportada: o banco inteiro duas vezes por hora gastaria quase toda a cota
      # do plano gratuito. Esta pergunta custa uma linha.
      - name: Houve alteração desde a última publicação?
        id: gate
        env:
          GATE: ${{ steps.task.outputs.gate }}
        run: |
          if [ "$GATE" = "true" ]; then
            npm run --silent publish:gate
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      # As migrations não são aplicadas aqui: mudar o esquema de produção é um
      # passo manual (`wrangler d1 migrations apply louvorja --remote`), feito
      # por quem está olhando.
      - name: Exportar o banco
        if: steps.gate.outputs.changed == 'true'
        run: npx --no-install wrangler d1 export louvorja --remote --output=replica.sql

      - name: Atualizar vídeos online
        if: steps.gate.outputs.changed == 'true' && steps.task.outputs.task == 'refresh_online_videos'
        run: >-
          npm run online-videos:refresh --
          --export=replica.sql
          --write

      - name: Importar apresentações
        if: steps.gate.outputs.changed == 'true' && steps.task.outputs.task == 'import_slides'
        run: >-
          npm run slides:import --
          --export=replica.sql
          --source=r2
          --write

      # Os passos seguintes leem o banco: se a importação ou os vídeos gravaram
      # nele, o export é refeito.
      - name: Exportar o banco depois da importação
        if: steps.gate.outputs.changed == 'true'
        run: |
          if grep -qsiE '^[[:space:]]*(INSERT|UPDATE|DELETE)' refresh-online-videos.sql import-slides.sql; then
            npx --no-install wrangler d1 export louvorja --remote --output=replica.sql
          fi

      # Arquivo novo chega só de um lado: o original enviado ao bucket dos
      # originais, ou o áudio de uma apresentação importada. Este passo guarda o
      # original e gera a versão dos apps atuais (Opus acima de 128 kbps, JPEG no
      # lugar de BMP), como o cron antigo fazia ao trazer a mídia da API PHP.
      - name: Mídia nova
        id: media
        if: steps.gate.outputs.changed == 'true'
        run: |
          npm run media:normalize -- --export=replica.sql --limit=150 --write
          if [ -s media-normalize.sql ]; then
            npx --no-install wrangler d1 export louvorja --remote --output=replica.sql
            printf 'wrote=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconciliar tamanhos
        if: steps.gate.outputs.changed == 'true' && steps.task.outputs.task == 'refresh_files_size'
        run: >-
          npm run files:reconcile --
          --export=replica.sql
          --task=size
          --write

      - name: Reconciliar durações
        if: steps.gate.outputs.changed == 'true' && steps.task.outputs.task == 'refresh_files_duration'
        run: >-
          npm run files:reconcile --
          --export=replica.sql
          --task=duration
          --write

      # Também quando a mídia nova gravou: o arquivo convertido tem outro tamanho.
      - name: Reconciliação completa
        if: >-
          steps.gate.outputs.changed == 'true' &&
          (steps.task.outputs.task == 'refresh_files_all' || steps.media.outputs.wrote == 'true')
        run: >-
          npm run files:reconcile --
          --export=replica.sql
          --task=all
          --write

      # A publicação precisa ler o que a reconciliação confirmou no D1. O banco
      # só é exportado de novo quando ela realmente gravou.
      - name: Exportar o banco depois da reconciliação
        if: steps.gate.outputs.changed == 'true'
        run: |
          if grep -qsiE '^[[:space:]]*(INSERT|UPDATE|DELETE)' reconcile-files.sql; then
            npx --no-install wrangler d1 export louvorja --remote --output=replica.sql
          fi

      - name: Publicar
        if: steps.gate.outputs.changed == 'true'
        run: npm run publish -- --export=replica.sql --write

      # O banco SQLite do Delphi sai do mesmo export, depois da publicação: só
      # então a versão nova do catálogo existe. Sem versão nova, não faz nada.
      - name: Banco do Delphi
        if: steps.gate.outputs.changed == 'true'
        run: npm run delphi:db -- --export=replica.sql --write

      # Não depende do banco: publicar um lançamento final do Delphi no GitHub
      # é o que faz o programa avisar que há versão nova.
      - name: Versão do Delphi
        run: npm run delphi:version -- --write

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manutencao-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            reconcile-files.sql
            reconcile-files-report.json
            refresh-online-videos.sql
            import-slides.sql
            import-slides-report.json
            media-normalize.sql
            media-normalize-report.json
            delphi-db-report.json
